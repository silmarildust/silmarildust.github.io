<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>janna's archive</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background-color: #f8f8f8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .icon {
      width: 50px;
      height: 50px;
    }
    h1 {
      font-weight: normal;
      margin: 0;
      font-size: 1.5rem;
      transition: color 0.3s ease;
      cursor: pointer;
    }
    h1:hover {
      color: #85B050;
    }
    .links {
      display: flex;
      gap: 1rem;
      font-size: 1rem;
    }
    a {
      color: #333;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    a:hover {
      text-decoration: underline;
      transform: scale(1.1);
    }
    .footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.75rem;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title-row">
      <img src="clover.png" alt="icon" class="icon">
      <h1><strong>janna's archive</strong></h1>
    </div>
    <div class="links">
      <a href="about.html">about</a>
      <span>|</span>
      <a href="writing.html">writing</a>
      <span>|</span>
      <a href="photography.html">photography</a>
      <span>|</span>
      <a href="art.html">art & design</a>
    </div>
  </div>
</body>
</html>
